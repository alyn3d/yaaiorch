<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAAIORCH - Yet Another AI Orchestrator</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/logo-64.png" sizes="64x64" />
    <!--
      The splash paints with the first HTML, before any script or stylesheet loads, so the window is never blank.
      React renders the same markup (src/Splash.tsx) until the server's first state arrives. These are its only styles.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #09090b;
        color: #ececef;
        font:
          14px/1.5 "Inter",
          "Segoe UI Variable Text",
          "Segoe UI",
          system-ui,
          -apple-system,
          "Helvetica Neue",
          sans-serif;
      }
      .splash {
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        padding: 24px;
      }
      .splash h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.08em;
      }
      .splash p {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #7f7f8a;
      }
      .splash-spinner {
        width: 14px;
        height: 14px;
        box-sizing: border-box;
        border: 2px solid #303038;
        border-top-color: #5a5df0;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      .splash-error {
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        color: #f5b84b;
      }
      .splash-error pre {
        max-height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        text-align: left;
        color: #a1a1aa;
        background: #0b0b0e;
        border: 1px solid #232329;
        padding: 10px;
        margin: 0;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <img class="splash-logo" src="/logo-64.png" alt="" width="64" height="64" />
        <h1>YAAIORCH</h1>
        <p><span class="splash-spinner" aria-hidden="true"></span>Starting…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
