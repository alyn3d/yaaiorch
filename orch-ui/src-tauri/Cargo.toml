[package]
name = "yaaiorch"
version = "0.2.0"
description = "YAAIORCH - Yet Another AI Orchestrator"
license = "MIT"
repository = "https://github.com/alyn3d/yaaiorch"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local date for the daily budget (already in the dependency tree through tauri).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
