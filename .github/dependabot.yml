version: 2
# Grouped PRs carry only minor and patch updates, which should build as they are.
# Major versions arrive as separate PRs, since they usually need code changes.
updates:
  - package-ecosystem: npm
    directory: /orch-ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /orch-ui/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
