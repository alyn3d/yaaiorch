name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Linux - build, scenarios, eval self-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orch-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install
        working-directory: orch-ui
        run: npm ci
      - name: Lint
        working-directory: orch-ui
        run: npm run lint
      - name: Format check
        working-directory: orch-ui
        run: npm run format:check
      - name: Typecheck and build the UI
        working-directory: orch-ui
        run: npm run build
      - name: Typecheck orch.ts
        working-directory: orch-ui
        run: npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --types node --skipLibCheck ../orch.ts
      - name: Bundle orch.mjs
        working-directory: orch-ui
        run: npm run build:orch
      - name: CLI smoke test
        run: |
          node orch-ui/src-tauri/resources/orch.mjs > usage.txt
          grep -q "YAAIORCH" usage.txt
      - name: Scenario tests (fake claude)
        timeout-minutes: 10
        working-directory: orch-ui
        run: npm test
      - name: Eval suite self-check (hidden tests fail before, pass with reference)
        run: node evals/run.ts --reference

  windows:
    name: Windows - scenarios, cargo check and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: orch-ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orch-ui/src-tauri
      # tauri-build needs the built frontend and the bundled orch.mjs resource to exist.
      - name: Build frontend and orch.mjs, fetch the bundled Node.js
        working-directory: orch-ui
        run: |
          npm ci
          npm run build:app
          node scripts/fetch-node.mjs
      - name: Scenario tests (fake claude)
        timeout-minutes: 10
        working-directory: orch-ui
        run: npm test
      - name: rustfmt
        working-directory: orch-ui/src-tauri
        run: cargo fmt --check
      - name: clippy (also type-checks)
        working-directory: orch-ui/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust unit tests
        working-directory: orch-ui/src-tauri
        run: cargo test --locked
      - name: Rust spawn test (desktop backend runs orch.mjs with the fake claude)
        working-directory: orch-ui/src-tauri
        shell: pwsh
        run: |
          $repo = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "spawn-test-repo")
          $env:TEST_REPO = $repo.FullName
          $env:ORCH_PATH = (Resolve-Path ../src-tauri/resources/orch.mjs).Path
          $env:CLAUDE_BIN = (Resolve-Path ../../test/fake-claude/claude.cmd).Path
          cargo test --locked -- --ignored
