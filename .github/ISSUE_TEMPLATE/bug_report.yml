name: Bug report
description: Something broke or a run went wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove anything private (code, paths, keys) from logs before pasting.
        Security problems: please use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Command or goal
      description: The `orch` command line (or UI action) and the goal text, if it is not private.
      render: shell
  - type: textarea
    id: doctor
    attributes:
      label: "`orch doctor` output"
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From the live output, or `.orchestrator/last-run.json`.
      render: text
  - type: dropdown
    id: mode
    attributes:
      label: Where
      options: [CLI, Browser UI, Desktop app, Eval runner]
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Windows 11, Node 24.1, Claude Code 2.x, yaaiorch commit abc1234"
    validations:
      required: true
