<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidewater · Pricing</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Tidewater</a>
      <nav>
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/pricing">Pricing</a>
      </nav>
    </header>
    <main class="page">
      <h1>Pricing</h1>
      <div class="plans">
        <section class="plan">
          <h2>Free</h2>
          <p class="price">$0<span>/month</span></p>
          <ul>
            <li>1 device</li>
            <li>100 notes</li>
          </ul>
        </section>
        <section class="plan">
          <h2>Pro</h2>
          <p class="price">$8<span>/month</span></p>
          <ul>
            <li>Unlimited devices</li>
            <li>Offline sync</li>
          </ul>
        </section>
        <section class="plan">
          <h2>Team</h2>
          <p class="price">$20<span>/user/month</span></p>
          <ul>
            <li>Shared notebooks</li>
            <li>Admin controls</li>
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
